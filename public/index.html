<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lattice Console</title>
<link rel="icon" type="image/svg+xml" href="/lattice-logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="frame">
  <header class="topbar">
    <div class="wordmark">
      <img class="logo" src="/lattice-logo.svg" alt="Lattice" width="22" height="22" />
      <span class="brand">LATTICE</span><span class="sep">//</span><span class="sub">CLAUDE&nbsp;CONSOLE</span>
    </div>
    <div class="topbar-right">
      <span id="conn" class="conn" title="live feed">● LIVE</span>
      <span id="clock" class="clock"></span>
    </div>
  </header>

  <nav class="rail">
    <a href="#/" data-view="review"><span class="k">01</span>REVIEW</a>
    <a href="#/fleet" data-view="fleet"><span class="k">02</span>FLEET</a>
    <a href="#/inbox" data-view="inbox"><span class="k">03</span>INBOX <span id="inbox-badge" class="badge" hidden></span></a>
    <a href="#/jobs" data-view="jobs"><span class="k">04</span>JOBS</a>
    <a href="#/search" data-view="search"><span class="k">05</span>SEARCH</a>
    <a href="#/usage" data-view="usage"><span class="k">06</span>USAGE</a>
    <div class="rail-foot">
      <div class="tick"></div>
      <span id="foot-stats"></span>
      <div class="keyhint">↑↓/jk move · ↵ open · a/t act (live→attach) · esc back · 1-5 views · / search</div>
    </div>
  </nav>

  <main id="main" class="main"></main>
</div>
<div class="scanlines" aria-hidden="true"></div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
